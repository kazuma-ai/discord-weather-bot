name: Send Weather Forecast

on:
  schedule:
    # 毎日 日本時間 07:00頃 (UTC 22:00) に実行
    # 00分ちょうどは混雑しやすいため、22:05 (日本時間07:05) に設定
    - cron: '5 22 * * *'
  workflow_dispatch: # 手動テスト実行ボタンを有効化

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python weather.py
