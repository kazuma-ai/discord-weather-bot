name: Send Weather Forecast

on:
  schedule:
    # 気象庁の発表(5時/11時/17時)のあと、1日3回実行
    # 日本時間 05:30, 11:30, 17:30 ＝ 世界標準時(UTC) 20:30, 02:30, 08:30
    - cron: '30 20,2,8 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run script
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python weather.py
